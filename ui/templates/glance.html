<div style="display:flex;gap:16px;overflow-x:auto;padding:2px 2px 14px">
{% set grads = [("#1A1400","#6B4F00"),("#2B2100","#8A6500"),("#3D2E00","#7A5800"),("#1A1400","#8A5A00"),("#2B2100","#6B4F00")] %}
{% for t in tiles %}
  {% set g = grads[loop.index0 % grads|length] %}
  <div class="flex-none rounded-2xl text-white relative overflow-hidden" style="width:190px;height:150px;background:linear-gradient(160deg,{{ g[0] }},{{ g[1] }})">
    <svg width="190" height="150" aria-hidden="true" style="position:absolute;inset:0"><circle cx="150" cy="36" r="40" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/><circle cx="150" cy="36" r="19" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/></svg>
    <div class="absolute left-4 top-4 text-sm text-white/90">{{ t.label }}</div>
    <div class="absolute left-4 right-4 top-10 text-3xl font-bold text-[#FFD21F]">{{ t.value }}</div>
    <div class="absolute left-4 right-4 bottom-4 text-base font-semibold leading-tight">{{ t.sub }}</div>
  </div>
{% endfor %}
</div>
